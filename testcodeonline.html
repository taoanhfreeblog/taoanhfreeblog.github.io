<style>
:root{--bg:#eceee9;--panel:#f8f8f4;--ink:#1b2a27;--mut:#5f6d68;--line:#cfd5cd;--acc:#1f6f5c;--on:#fff;--err:#b3261e;--errbg:#f6d9d5;--warn:#8a5a00;--warnbg:#f4e6c6;--info:#2b5fa8;--sel:#dfe8e3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#121c19;--panel:#192623;--ink:#e3ebe6;--mut:#93a39c;--line:#2c3d38;--acc:#5cc2a6;--on:#0c1613;--err:#ff8a80;--errbg:#3a1f1d;--warn:#e5b858;--warnbg:#3a301a;--info:#8ab4f0;--sel:#253a34}
:root{--c-tag:#c2255c;--c-at:#9a6700;--c-st:#1b7a3d;--c-kw:#7b3fc9;--c-var:#0a5fb4;--c-fn:#0f766e;--c-num:#b45309;--c-cm:#7a8a84}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-tag:#ff7aa8;--c-at:#e5b858;--c-st:#8fd694;--c-kw:#c9a0ff;--c-var:#7cc4ff;--c-fn:#5eead4;--c-num:#ffb27a;--c-cm:#6f8279}}
:root[data-theme="dark"]{--c-tag:#ff7aa8;--c-at:#e5b858;--c-st:#8fd694;--c-kw:#c9a0ff;--c-var:#7cc4ff;--c-fn:#5eead4;--c-num:#ffb27a;--c-cm:#6f8279}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Be Vietnam Pro",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 8px 0 0;font-weight:600}
button,label.btn{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--acc)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

#sum{margin-left:auto;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:9px 18px 9px 10px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.28);font-weight:600;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}

.split{background:var(--line);cursor:col-resize;touch-action:none;position:relative}
.split::after{content:"";position:absolute;left:3px;top:50%;width:4px;height:44px;margin-top:-22px;border-radius:2px;background:var(--mut);opacity:.6}
.split:hover,.split.on,.split:focus-visible{background:var(--acc);outline:none}
.split:hover::after,.split.on::after,.split:focus-visible::after{background:var(--on);opacity:1}
body.drag{user-select:none}body.drag iframe{pointer-events:none}
section{min-width:0;min-height:0;display:flex;flex-direction:column}
.ed{position:relative;flex:1;min-height:0;display:flex;background:var(--panel);border-right:1px solid var(--line);font:13px/20px "JetBrains Mono",ui-monospace,monospace}

textarea{position:absolute;inset:0;width:100%;height:100%;margin:0;border:0;resize:none;background:transparent;color:transparent;caret-color:var(--ink);font:inherit;font-variant-ligatures:none;padding:8px 10px;white-space:pre;overflow:auto;tab-size:2}

.vr{color:var(--c-var)}

.c.error{color:var(--err)}.c.warn{color:var(--warn)}

.mx-1{margin-right:.25rem!important;margin-left:.25rem!important}.mx-2{margin-right:.5rem!important;margin-left:.5rem!important}.mx-3{margin-right:1rem!important;margin-left:1rem!important}.mx-4{margin-right:1.5rem!important;margin-left:1.5rem!important}.mx-5{margin-right:3rem!important;margin-left:3rem!important}.mx-auto{margin-right:auto!important;margin-left:auto!important}.my-0{margin-top:0!important;margin-bottom:0!important}.my-1{margin-top:.25rem!important;margin-bottom:.25rem!important}.my-2{margin-top:.5rem!important;margin-bottom:.5rem!important}.my-3{margin-top:1rem!important;margin-bottom:1rem!important}.my-4{margin-top:1.5rem!important;margin-bottom:1.5rem!important}.my-5{margin-top:3rem!important;margin-bottom:3rem!important}.my-auto{margin-top:auto!important;margin-bottom:auto!important}.mt-0{margin-top:0!important}.mt-1{margin-top:.25rem!important}.mt-2{margin-top:.5rem!important}.mt-3{margin-top:1rem!important}.mt-4{margin-top:1.5rem!important}.mt-5{margin-top:3rem!important}.mt-auto{margin-top:auto!important}.me-0{margin-right:0!important}.me-1{margin-right:.25rem!important}.me-2{margin-right:.5rem!important}.me-3{margin-right:1rem!important}.me-4{margin-right:1.5rem!important}.me-5{margin-right:3rem!important}
@media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:minmax(120px,var(--lh,1fr)) 10px minmax(120px,1fr)}.ed{border-right:0;border-bottom:1px solid var(--line)}.split{cursor:row-resize}.split::after{left:50%;top:3px;width:44px;height:4px;margin:0 0 0 -22px}}
</style>

<body>
<header>
  <h1>Kiểm tra code HTML</h1>
  <button class="pri" id="run">Run</button>
  <label><input type="checkbox" id="auto"> Auto Preview</label>
  <button id="sample">Code mẫu</button>
  <label class="btn">Mở file<input type="file" id="file" accept=".html,.htm,.txt" hidden></label>
  <button id="cp">Copy</button>
  <button id="dl">Download</button>
  <button id="clear">Xóa</button>
  <span id="sum"></span><span id="saved" class="hint" aria-live="polite"></span>
</header>
<span id="mt" class="hint mx-4"></span>
<main>
  <section>
    <div class="ed"><div class="gut" id="gut"></div>
      <div class="wrap"><div class="hl" id="hl"></div><pre class="syn" id="syn" aria-hidden="true"></pre><textarea id="ta" spellcheck="false" aria-label="Mã nguồn" placeholder="Dán hoặc gõ code HTML vào đây để kiểm tra…"></textarea></div></div>
  </section>
  <div class="split" id="split" role="separator" aria-orientation="vertical" tabindex="0" title="Kéo để đổi kích thước (nhấp đúp để đặt lại)"></div>
  <section>
    <nav id="tabs">
      <button data-t="pv" class="on">Xem trước</button>
      <button data-t="iss">Vấn đề<b id="n-iss">0</b></button>
      <button data-t="var">Biến<b id="n-var">0</b></button>
      <button data-t="fn">Hàm<b id="n-fn">0</b></button>
      <button data-t="tg">Thẻ HTML<b id="n-tg">0</b></button>
      <button data-t="con">Console<b id="n-con">0</b></button>
    </nav>
    <div class="pane" id="iss"></div>
    <div class="pane" id="var"></div>
    <div class="pane" id="fn"></div>
    <div class="pane" id="tg"></div>
    <div class="pane" id="con"></div>
    <div class="pane on" id="pv"><iframe id="frame" sandbox="allow-scripts allow-modals allow-forms" title="Xem trước"></iframe></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"><i></i><span></span></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VOID=new Set('area base br col embed hr img input link meta param source track wbr'.split(' '));
const OPT=new Set('li p dt dd tr td th option thead tbody tfoot'.split(' '));
const BLOCK=new Set('div ul ol table h1 h2 h3 h4 h5 h6 p section header footer nav main article aside form pre blockquote'.split(' '));
const KNOWN=new Set('html head body div span p a ul ol li h1 h2 h3 h4 h5 h6 script style table tr td th thead tbody img br input button form label section header footer nav main article aside title meta link select option textarea pre code em strong b i'.split(' '));
const SAMPLE=['<!DOCTYPE html>','<html>','<head>','  <title>Thử nghiệm</title>','  <style>','    .card { padding: 12px; border: 1px solid #999;','  </style>','</head>','<body>','  <div id="app" class="card">','    <h1>Xin chào</h1>','    <p>Đoạn văn','    div>Thiếu dấu mở thẻ</div>','    <button id="btn" onclick="tinhTong()">Tính</button>','    <img src="a.png">','  </div>','  </div>','  <div id="app">Trùng id</div>','','  <script>','    const GIA = 100;','    let soLuong = 3;','    var tenSP = "Bút";','    const tinhTong = () => { GIA = 200; return GIA * soLuong; };','    function chao(ten) { console.log("Chào " + ten + tenSp); }','    chao("An");','    console.log(tinhTong());','  <\/script>','</body>','</html>'].join('\n');

/* ---------- Phân tích HTML ---------- */
function parseHTML(src){
  const ls=[0];for(let k=0;k<src.length;k++)if(src[k]==='\n')ls.push(k+1);
  const L=p=>{let a=0,b=ls.length-1;while(a<b){const m=(a+b+1)>>1;if(ls[m]<=p)a=m;else b=m-1}return a+1};
  const R={issues:[],tags:[],scripts:[],styles:[],ids:new Set(),handlers:[]};
  const add=(sev,pos,msg,hint)=>R.issues.push({sev,line:L(pos),msg,hint});
  const st=[],n=src.length;let i=0;
  while(i<n){
    if(src[i]!=='<'){
      let e=src.indexOf('<',i);if(e<0)e=n;
      const seg=src.slice(i,e);let g=seg.indexOf('>');
      while(g>=0){
        const pos=i+g,before=src.slice(src.lastIndexOf('\n',pos-1)+1,pos);
        const m=/(\/?[A-Za-z][\w:-]*)(\s[^<>]*)?$/.exec(before);
        if(m&&KNOWN.has(m[1].replace('/','').toLowerCase()))add('error',pos,`Có thể thiếu "<" trước "${m[1]}"`,`Sửa thành <${m[1]}${m[2]||''}>`);
        else add('warn',pos,'Dấu ">" đứng riêng trong nội dung','Dùng &gt; nếu muốn hiển thị ký tự này, hoặc kiểm tra thẻ phía trước có thiếu "<" không');
        g=seg.indexOf('>',g+1);
      }
      i=e;continue;
    }
    const i0=i;
    if(src.startsWith('<!--',i)){const e=src.indexOf('-->',i+4);if(e<0){add('error',i,'Chú thích <!-- không có --> đóng');break}i=e+3;continue}
    if(src[i+1]==='!'||src[i+1]==='?'){const e=src.indexOf('>',i);i=e<0?n:e+1;continue}
    const m=/^<(\/?)([A-Za-z][\w:-]*)/.exec(src.slice(i,i+80));
    if(!m){add('error',i,'Dấu "<" không mở thẻ hợp lệ','Dùng &lt; nếu muốn hiển thị ký tự "<", hoặc sửa tên thẻ');i++;continue}
    const close=!!m[1],name=m[2].toLowerCase();let j=i+m[0].length,self=false,ended=false;const attrs=[],seen=new Set();
    while(j<n){
      while(j<n&&/\s/.test(src[j]))j++;
      const ch=src[j];
      if(ch==='>'){ended=true;j++;break}
      if(ch==='/'&&src[j+1]==='>'){self=true;ended=true;j+=2;break}
      if(ch==='/'){j++;continue}
      if(ch==='<')break;
      const am=/^[^\s=>\/"'<]+/.exec(src.slice(j,j+200));
      if(!am){j++;continue}
      const an=am[0].toLowerCase();let av=null;const ap=j;j+=am[0].length;
      let k=j;while(k<n&&/\s/.test(src[k]))k++;
      if(src[k]==='='){
        k++;while(k<n&&/\s/.test(src[k]))k++;
        const q=src[k];
        if(q==='"'||q==="'"){const e=src.indexOf(q,k+1);if(e<0){add('error',ap,`Thuộc tính ${an} thiếu dấu ${q} đóng`);j=n;ended=true;break}av=src.slice(k+1,e);j=e+1}
        else{av=/^[^\s>]*/.exec(src.slice(k,k+300))[0];j=k+av.length}
      }
      if(seen.has(an))add('warn',ap,`Thuộc tính ${an} bị lặp trong <${name}>`);seen.add(an);
      attrs.push([an,av]);
      if(an==='id'&&av){if(R.ids.has(av))add('error',ap,`id="${av}" bị trùng`,'Mỗi id chỉ được dùng một lần');R.ids.add(av)}
      if(/^on/.test(an)&&av){const re=/(?<![.\w$])([A-Za-z_$][\w$]*)\s*\(/g;let x;while((x=re.exec(av)))if(!/^(if|for|while|switch|function|return|catch)$/.test(x[1]))R.handlers.push({name:x[1],line:L(ap),attr:an})}
    }
    if(!ended){if(j>=n)add('error',i,`Thẻ <${name}> không có dấu ">" kết thúc`);else add('error',i,`Thẻ <${name} …> thiếu ">" (gặp "<" mới ở dòng ${L(j)})`,'Thêm ">" sau thuộc tính cuối của thẻ')}
    i=j;
    if(close){
      if(VOID.has(name)){add('warn',i0,`<${name}> là thẻ rỗng, không cần </${name}>`);continue}
      let k=st.length-1;while(k>=0&&st[k].name!==name)k--;
      if(k<0){add('error',i0,`Thẻ đóng </${name}> thừa: không có <${name}> nào đang mở`,'Xóa thẻ này hoặc thêm thẻ mở tương ứng');continue}
      for(let x=st.length-1;x>k;x--){const t=st[x];if(!OPT.has(t.name)){t.bad=true;add('error',t.pos,`Thẻ <${t.name}> chưa được đóng`,`Thêm </${t.name}> trước </${name}> ở dòng ${L(i0)}`)}}
      st.length=k;continue;
    }
    const top=st[st.length-1];
    if(top&&top.name==='p'&&BLOCK.has(name))st.pop();
    else if(top&&OPT.has(name)&&top.name===name)st.pop();
    const tag={name,line:L(i0),pos:i0,depth:st.length,bad:false,attrs};
    R.tags.push(tag);
    if(name==='img'&&!seen.has('alt'))add('info',i0,'<img> thiếu thuộc tính alt','Thêm alt="mô tả" để hỗ trợ người dùng đọc màn hình');
    if(VOID.has(name)||self)continue;
    st.push(tag);
    if(/^(script|style|textarea|title)$/.test(name)){
      const re=new RegExp('</'+name+'\\b','ig');re.lastIndex=i;const c=re.exec(src);
      if(!c){tag.bad=true;add('error',i0,`Thẻ <${name}> chưa có </${name}>`);i=n;break}
      const code=src.slice(i,c.index),type=(attrs.find(a=>a[0]==='type')||[])[1]||'',hasSrc=attrs.some(a=>a[0]==='src');
      if(name==='script'&&!hasSrc&&(!type||/javascript|module/i.test(type)))R.scripts.push({code,line:L(i),module:/module/i.test(type)});
      if(name==='style')R.styles.push({code,line:L(i)});
      i=c.index;
    }
  }
  st.forEach(t=>{if(!OPT.has(t.name)){t.bad=true;add('error',t.pos,`Thẻ <${t.name}> chưa được đóng`,`Thêm </${t.name}> ở cuối phần nội dung của nó`)}});
  R.styles.forEach(s=>{const c=s.code.replace(/\/\*[\s\S]*?\*\//g,'');const o=(c.match(/{/g)||[]).length,e=(c.match(/}/g)||[]).length;if(o!==e)R.issues.push({sev:'error',line:s.line,msg:`CSS lệch ngoặc: ${o} dấu "{" nhưng ${e} dấu "}"`,hint:'Kiểm tra lại các khối { } trong <style>'})});
  return R;
}

/* ---------- Phân tích JS ---------- */
function analyzeJS(H){
  const decl=[],funcs=[],refs={},refLine={},calls={},assigns=[],declared=new Set(),issues=[];let src,off;
  const add=(sev,line,msg,hint)=>issues.push({sev,line,msg,hint});
  const names=p=>!p?[]:p.type==='Identifier'?[p]:p.type==='ObjectPattern'?p.properties.flatMap(x=>names(x.value||x.argument)):p.type==='ArrayPattern'?p.elements.flatMap(names):p.type==='AssignmentPattern'?names(p.left):p.type==='RestElement'?names(p.argument):[];
  const dec=(id,kind,sc,init)=>{declared.add(id.name);decl.push({name:id.name,kind,line:id.loc.start.line+off,scope:sc,init})};

function show(t){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===t))}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)});
document.addEventListener('click',e=>{const r=e.target.closest('[data-l]');if(r)goLine(+r.dataset.l);if(e.target.id==='cc'){cons=[];renderCons()}});
$('#run').onclick=()=>{run();show('pv')};
$('#sample').onclick=()=>{ta.value=SAMPLE;analyze()};
$('#clear').onclick=()=>{ta.value='';analyze();ta.focus()};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ta.value=r.result;analyze()};r.readAsText(f)};
const sp=$('#split'),mn=$('main'),mob=()=>matchMedia('(max-width:900px)').matches;
function setSize(px){const r=mn.getBoundingClientRect(),tot=mob()?r.height:r.width;px=Math.max(160,Math.min(tot-176,px));mn.style.setProperty(mob()?'--lh':'--lw',px+'px')}
sp.addEventListener('pointerdown',e=>{sp.setPointerCapture(e.pointerId);document.body.classList.add('drag');sp.classList.add('on')});
sp.addEventListener('pointermove',e=>{if(!sp.hasPointerCapture(e.pointerId))return;const r=mn.getBoundingClientRect();setSize(mob()?e.clientY-r.top:e.clientX-r.left)});
['pointerup','pointercancel'].forEach(t=>sp.addEventListener(t,()=>{document.body.classList.remove('drag');sp.classList.remove('on')}));
sp.addEventListener('dblclick',()=>{mn.style.removeProperty('--lw');mn.style.removeProperty('--lh');saveSize()});
sp.addEventListener('pointerup',saveSize);
sp.addEventListener('keydown',e=>{const d={ArrowLeft:-30,ArrowUp:-30,ArrowRight:30,ArrowDown:30}[e.key];if(!d)return;e.preventDefault();const r=sp.previousElementSibling.getBoundingClientRect();setSize((mob()?r.height:r.width)+d)});
let tt;
function toast(t){const e=$('#toast'),ok=/^Đã (copy|tải)/.test(t);e.className='toast show'+(ok?'':' warn');e.querySelector('i').textContent=ok?'✓':'!';e.querySelector('span').textContent=t;clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2400)}
$('#cp').onclick=async()=>{
  const code=ta.value,msg=t=>toast(t);
  if(!code.trim()){msg('Chưa có code để copy');return}
  try{await navigator.clipboard.writeText(code);msg('Đã copy code vào clipboard');return}catch(e){}
  try{const a=ta.selectionStart,b=ta.selectionEnd;ta.focus();ta.select();const ok=document.execCommand('copy');ta.setSelectionRange(a,b);msg(ok?'Đã copy code vào clipboard':'Không copy được, hãy bôi đen và nhấn Ctrl+C')}catch(e){msg('Không copy được, hãy bôi đen và nhấn Ctrl+C')}
};
let DL=null;
try{window.claude&&claude.use&&claude.use('downloads').then(d=>{DL=d},()=>{})}catch(e){}
$('#dl').onclick=async()=>{
  const code=ta.value,msg=t=>toast(t);
  if(!code.trim()){msg('Chưa có code để tải');return}
  const t=/<title[^>]*>([\s\S]*?)<\/title>/i.exec(code),slug=t&&t[1].trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),name=(slug||'code')+'.html';
  if(DL){try{await DL.save({filename:name,data:code});msg('Đã tải '+name)}catch(e){msg(e&&e.code==='declined'?'Đã hủy tải':'Không tải được file')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/html'}));a.download=name;document.body.appendChild(a);a.click();a.remove();msg('Đã tải '+name)}catch(e){msg('Không tải được file')}
};
function saveSize(){store.set(KS,JSON.stringify([mn.style.getPropertyValue('--lw'),mn.style.getPropertyValue('--lh')]))}
try{const z=JSON.parse(store.get(KS)||'null');if(z){if(z[0])mn.style.setProperty('--lw',z[0]);if(z[1])mn.style.setProperty('--lh',z[1])}}catch(e){}
document.addEventListener('selectionchange',()=>{if(document.activeElement!==ta)return;const r=matchSet(curT,ta.selectionStart,ta.selectionEnd);if([...r.M].join()!==curKey)paintSyn();else showMt(r,ta.value)});
ta.addEventListener('blur',paintSyn);
addEventListener('pagehide',save);
const sv=store.get(KEY);ta.value=(sv===null||sv===SAMPLE)?'':sv;analyze();renderCons();run();
</script>
</body>
</html>
